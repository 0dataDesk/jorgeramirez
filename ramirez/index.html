<style>

.tabla{display:flex;flex-direction:column;border-top:1px solid rgba(232,237,244,.2)}
.tabla .r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(232,237,244,.2);font-size:16px}
.tabla .r span{color:var(--gl);flex:none}
.tabla .r strong{text-align:right}
.tabla .s{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.tabla .s>span{color:var(--gl);font-size:16px}
.tam button{flex:1;min-height:48px;border:1.5px solid rgba(74,144,217,.5);background:transparent;color:var(--white);font-weight:700;font-size:14px;cursor:pointer}
.tam button.sel{border-color:var(--blue);background:var(--blue);color:var(--navy)}
.res{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--gl);color:var(--navy)}
.res .m{font-family:var(--mono);font-size:12px}
.res .p{font-size:23px;line-height:1.25;font-weight:800;text-wrap:pretty}
.res .s2{font-size:18px;line-height:1.4;font-weight:500;text-wrap:pretty}
.res .x{font-size:14px;line-height:1.5}
.res .wa{display:flex;align-items:center;justify-content:center;height:60px;margin-top:4px;background:var(--green);color:var(--navy);font-weight:800;font-size:16px}
.res .nota{font-size:12px;text-align:center}
.wafab{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border-radius:28px;background:var(--green);color:var(--navy);font-weight:800;font-size:15px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.wafab svg{fill:var(--navy)}
[hidden]{display:none!important}
</style>

<script>
(function(){
var META=[
 {n:'01',title:'Conocer tu negocio',short:'Conocer',lead:'Cómo opera de verdad, no como te lo imaginas.'},
 {n:'02',title:'Encontrar los puntos críticos',short:'Puntos críticos',lead:'Dónde se pierde dinero, tiempo o información.'},

];
var BIZ={
 restaurante:{label:'Restaurante',sub:'Cocina, barra, salón',noun:'restaurante',art:'un',item:'platillo',items:'platillos',demo:'Demo de restaurante',
  ex:['En el papel, la orden de chilaquiles lleva 120 g de pollo. En la línea, a las 2 de la tarde, salen con 160.',
      '40 g de más por plato, 90 platos al día: casi 110 kg de pollo al mes que nadie cobra.',

  cajaPunto:'Cancelaciones, descuentos y propinas sin una regla clara.',crit:['cocina','almacen','caja'],sol:'cocina',
  zones:[
   {k:'salon',name:'Salón',pain:'ganancia',p:[0,0,60,62],note:'Mesas llenas no siempre son ganancia: depende de qué se vende.'},
   {k:'cocina',name:'Cocina',pain:'merma',p:[60,0,40,58],note:'Porciones de más en hora pico: la merma que no se ve.'},
   {k:'barra',name:'Barra',pain:'ganancia',p:[0,62,36,38],note:'Las bebidas suelen dejar más margen que los platillos. ¿Sabes cuánto?'},
   {k:'caja',name:'Caja',pain:'caja',p:[36,62,24,38],note:'Cancelaciones y descuentos: donde el corte deja de cuadrar.'},
   {k:'almacen',name:'Almacén',pain:'merma',p:[60,58,22,42],note:'Lo que entra sin revisarse contra la factura.'},
   {k:'oficina',name:'Oficina',pain:'dependo',p:[82,58,18,42],note:'Si todo pasa por ti, el negocio se detiene cuando no estás.'}]},
 tienda:{label:'Tienda',sub:'Mostrador, bodega, caja',noun:'tienda',art:'una',item:'producto',items:'productos',demo:'Demo de tienda',
  ex:['En el sistema hay 24 piezas. En el anaquel, 17. Nadie sabe cuándo se fueron.',
      'Un faltante de 3% en 800 mil pesos de inventario son 24 mil pesos que pagaste y no vas a vender.',
      'Conteo cíclico: 20 productos al día, 15 minutos antes de abrir. Sin sistema nuevo.',
      'Las primeras 4 semanas contamos juntos. Después lo hace el encargado y yo reviso los números.'],
  merma:'El inventario no cuadra',mermaRes:{punto:'Entradas y salidas que no se registran.',sol:'Conteo cíclico: pocos productos cada día, en lugar de un inventario gigante al año.'},
  cajaPunto:'Devoluciones y cancelaciones sin autorización.',crit:['bodega','recepcion','caja'],sol:'bodega',
  zones:[
   {k:'piso',name:'Piso de venta',pain:'ganancia',p:[0,0,64,62],note:'Lo que más se vende no siempre es lo que más deja.'},
   {k:'bodega',name:'Bodega',pain:'merma',p:[64,0,36,62],note:'Piezas que están en el sistema y no en el anaquel.'},
   {k:'caja',name:'Caja',pain:'caja',p:[0,62,30,38],note:'Devoluciones sin autorización: el corte no cuadra.'},
   {k:'mostrador',name:'Mostrador',pain:'ganancia',p:[30,62,34,38],note:'Descuentos al cliente frecuente que nadie registra.'},
   {k:'recepcion',name:'Recepción',pain:'merma',p:[64,62,18,38],note:'Mercancía que entra sin contarse.'},
   {k:'oficina',name:'Oficina',pain:'dependo',p:[82,62,18,38],note:'Si todo pasa por ti, la tienda se detiene cuando no estás.'}]},
 otro:{label:'Otro',sub:'Servicios, distribución, oficina',noun:'negocio',art:'un',item:'servicio',items:'servicios',demo:'Demos de restaurante y tienda',
  ex:['Te pregunto cómo se hace una venta, de la llamada al cobro. Casi siempre hay 3 versiones distintas.',

  merma:'Se pierden pedidos o material',mermaRes:{punto:'El paso de un área a otra.',sol:'Un solo formato de pedido, con un responsable por etapa.'},
  cajaPunto:'Cobros que se registran en más de un lugar.',crit:['operacion','entregas','cobranza'],sol:'operacion',
  zones:[
   {k:'ventas',name:'Ventas',pain:'ganancia',p:[0,0,56,56],note:'Cotizaciones que se hacen a ojo.'},
   {k:'operacion',name:'Operación',pain:'merma',p:[56,0,44,56],note:'Pedidos que pasan por 4 personas y 2 chats.'},
   {k:'entregas',name:'Entregas',pain:'merma',p:[0,56,40,44],note:'Lo que se promete contra lo que se entrega.'},
   {k:'cobranza',name:'Cobranza',pain:'caja',p:[40,56,30,44],note:'Cobros registrados en más de un lugar.'},
   {k:'oficina',name:'Dirección',pain:'dependo',p:[70,56,30,44],note:'Si todo pasa por ti, el negocio se detiene cuando no estás.'}]}
};
var SIZES=['Una','2 o 3','4 o más'];
var PALETA={obs:['#4a90d9','rgba(74,144,217,.10)','#e8edf4'],ghost:['rgba(74,144,217,.45)','transparent','#93a1b8'],dim:['rgba(74,144,217,.35)','transparent','#93a1b8'],crit:['#ff7a59','rgba(255,122,89,.24)','#ffffff'],critF:['rgba(255,122,89,.65)','rgba(255,122,89,.08)','#e8edf4'],sol:['#4caf82','rgba(76,175,130,.3)','#ffffff'],ok:['#4caf82','rgba(76,175,130,.10)','#e8edf4']};
var WA='https://wa.me/525543183792?text=';

var S={phase:'inicio',step:0,biz:null,pain:null,size:null,zone:null};
try{var q=new URLSearchParams(location.search),b=q.get('biz');if(BIZ[b])S.biz=b;}catch(e){}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bk(){return S.biz||'restaurante'}
function $(id){return document.getElementById(id)}
function irArriba(){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}}

function set(o,arriba){for(var k in o)S[k]=o[k];render();if(arriba)irArriba();}
function pickBiz(k){
  if(S.phase==='inicio') set({biz:k,phase:'pasos',step:0,zone:null},true);
  else set({biz:k,zone:null,pain:S.phase==='diag'?null:S.pain});
}

function painLabels(B){return {ganancia:'Vendo bien, pero no veo la ganancia',merma:B.merma,caja:'El corte de caja no cuadra',dependo:'Todo depende de mí'}}
function resultado(B){
  var r={ganancia:{punto:'El costo real de cada '+B.item+': casi nunca es el que crees.',sol:'Costear tus 20 '+B.items+' que más vendes y revisar precios. En dos semanas sabes cuáles te dejan y cuáles te cuestan.'},
    merma:B.mermaRes,caja:{punto:B.cajaPunto,sol:'Un corte de caja con formato fijo, por turno, firmado por quien entrega y quien recibe.'},
    dependo:{punto:'Decisiones que hoy solo tú sabes tomar.',sol:'Escribir las 5 decisiones diarias que pasan por ti y quién las toma cuando no estás. Primero en papel.'}}[S.pain];
  return {punto:r.punto,sol:r.sol,extra:S.size>0?'Con varias sucursales, se resuelve primero en una y luego se copia a las demás.':''};
}

function render(){
  var inicio=S.phase==='inicio',pasos=S.phase==='pasos',diag=S.phase==='diag';
  var B=BIZ[bk()];
  $('hero').hidden=!inicio;

  // tipos de negocio (barra sobre el plano)
  $('tipos').innerHTML=Object.keys(BIZ).map(function(k){
    var sel=S.biz===k&&!inicio;
    return '<button type="button" class="tipo'+(sel?' sel':'')+'" data-biz="'+k+'" aria-pressed="'+sel+'">'+esc(BIZ[k].label)+'</button>';
  }).join('');

  // plano
  $('plano').innerHTML=B.zones.map(function(z){
    var st='obs';
    if(inicio)st='ghost';
    if(pasos&&S.step===1)st=B.crit.indexOf(z.k)>-1?'crit':'dim';
    if(pasos&&S.step===2)st=z.k===B.sol?'sol':(B.crit.indexOf(z.k)>-1?'critF':'dim');
    if(pasos&&S.step===3)st='ok';
    if(diag&&S.pain)st=z.pain===S.pain?'crit':'dim';
    var sel=S.zone===z.k&&!inicio,c=PALETA[st];
    var badge=['crit','critF','sol','ok'].indexOf(st)>-1;
    var warn=st.indexOf('crit')===0;
    return '<button type="button" class="zona" data-zona="'+z.k+'" style="left:calc('+z.p[0]+'% + 4px);top:calc('+z.p[1]+'% + 4px);width:calc('+z.p[2]+'% - 8px);height:calc('+z.p[3]+'% - 8px);border-width:'+(sel?'2.5px':'1.5px')+';border-color:'+(sel?'#ffffff':c[0])+';background:'+c[1]+';color:'+c[2]+'">'
      +'<span class="n">'+esc(z.name)+'</span>'
      +(badge?'<span class="b" style="background:'+(warn?'#ff7a59':'#4caf82')+'">'+(warn?'!':'✓')+'</span>':'')
      +'</button>';
  }).join('');

  $('hint').textContent=diag?'TOCA DÓNDE TE DUELE':'TOCA UNA ZONA';

  // panel derecho
  var h='';
  if(inicio){
    h='<div class="lista">'+Object.keys(BIZ).map(function(k){
      return '<button type="button" data-pick="'+k+'"><span class="t"><b>'+esc(BIZ[k].label)+'</b><span>'+esc(BIZ[k].sub)+'</span></span><span class="f" aria-hidden="true">→</span></button>';
    }).join('')+'</div>';
  }
  if(pasos){
    var m=META[S.step],zn=B.zones.filter(function(z){return z.k===S.zone})[0];
    h='<div class="pasos"><div class="tabs">'+META.map(function(t,i){
      var cls=i===S.step?' cur':(i<S.step?' past':'');
      return '<button type="button" class="'+cls.trim()+'" data-paso="'+i+'"><span class="tn">'+t.n+'</span><span class="ts">'+esc(t.short)+'</span></button>';
    }).join('')+'</div>'
    +'<h2>'+esc(m.title)+'</h2><p class="lead">'+esc(m.lead)+'</p>'
    +'<div class="ej"><small>EJEMPLO EN '+esc(B.art.toUpperCase()+' '+B.noun.toUpperCase())+'</small><span>'+esc(B.ex[S.step])+'</span></div>'
    +(zn?'<div class="zn"><small>'+esc(zn.name)+'</small><span>'+esc(zn.note)+'</span></div>':'')
    +(S.step===3?'<div class="demo"><span>'+esc(B.demo)+' con datos ficticios</span><small>PRÓXIMAMENTE</small></div>':'')
    +'<div class="nav">'+(S.step>0?'<button type="button" class="prev" data-prev aria-label="Paso anterior">←</button>':'')
    +'<button type="button" class="next" data-next>'+(S.step<3?'Siguiente: '+esc(META[S.step+1].short):'Hacer mi diagnóstico')+' →</button></div></div>';
  }
  if(diag){
    var pl2=painLabels(B);
    h='<div class="diag"><span class="k">DIAGNÓSTICO · 3 TOQUES</span><h2>Toca dónde te duele.</h2>'
    +'<div class="tabla"><div class="r"><span>1 · Negocio</span><strong>'+esc(B.label)+'</strong></div>'
    +'<div class="r"><span>2 · En el plano</span><strong>'+esc(S.pain?pl2[S.pain]:'Toca una zona')+'</strong></div>'
    +'<div class="s"><span>3 · Sucursales</span><div class="fila tam">'+SIZES.map(function(l,i){return '<button type="button" class="'+(S.size===i?'sel':'')+'" data-size="'+i+'" aria-pressed="'+(S.size===i)+'">'+esc(l)+'</button>'}).join('')+'</div></div></div>';
    if(S.pain&&S.size!==null){
      var r=resultado(B);
      var sz=S.size===0?'una sucursal':SIZES[S.size]+' sucursales';
      var msg='Hola Jorge, vengo de tu página. Tengo '+B.art+' '+B.noun+' con '+sz+'. Lo que más me duele: '+pl2[S.pain].toLowerCase()+'. ¿Platicamos?';
      h+='<div class="res"><span class="m">En casos así, el punto crítico suele ser:</span><span class="p">'+esc(r.punto)+'</span>'
        +'<span class="m">Y la solución, algo como:</span><span class="s2">'+esc(r.sol)+'</span>'
        +(r.extra?'<span class="x">'+esc(r.extra)+'</span>':'')
        +'<a class="wa" href="'+WA+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Mandar mi diagnóstico por WhatsApp</a>'
        +'<span class="nota">Se abre WhatsApp con tus respuestas ya escritas.</span></div>';
    }
    h+='</div>';
  }
  $('panel').innerHTML=h;

  // WhatsApp general
  var gen=S.biz?'Hola Jorge, vi tu página. Tengo '+B.art+' '+B.noun+' y me gustaría platicar.':'Hola Jorge, vi tu página y me gustaría platicar.';
  $('wagen').href=WA+encodeURIComponent(gen);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var B=BIZ[bk()];
  if(t.dataset.biz){pickBiz(t.dataset.biz);return;}
  if(t.dataset.pick){set({biz:t.dataset.pick,phase:'pasos',step:0,zone:null},true);return;}
  if(t.dataset.paso!==undefined){set({phase:'pasos',step:+t.dataset.paso,zone:null,biz:S.biz||'restaurante'},true);return;}
  if(t.hasAttribute('data-next')){
    if(S.step<3)set({step:S.step+1,zone:null},true);else set({phase:'diag',zone:null},true);return;}
  if(t.hasAttribute('data-prev')){set({step:Math.max(0,S.step-1),zone:null},true);return;}
  if(t.dataset.size!==undefined){set({size:+t.dataset.size});return;}
  if(t.dataset.zona){
    var z=B.zones.filter(function(x){return x.k===t.dataset.zona})[0];
    if(S.phase==='diag')set({zone:z.k,pain:z.pain});
    else if(S.phase==='inicio')set({biz:bk(),phase:'pasos',step:0,zone:z.k},true);
    else set({zone:z.k});
  }
});
render();
})();
</script>
</body>
</html>
