<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorge Malgesto</title>
  <meta name="description" content="Bajo · Datos · CDMX">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --bg:          #f5f0e6;
      --bg-card:     #ede8d8;
      --bg-soft:     #e4dece;
      --text:        #1a1508;
      --text-soft:   #3d3420;
      --text-mute:   #6b6050;
      --text-dim:    #8a8070;
      --text-faint:  #b0a888;
      --border:      #ccc4a8;
      --border-soft: #bab09a;
      --green:       #4e8020;
      --gold:        #a07018;
      --red:         #a02818;

      --serif: 'Fraunces', Georgia, serif;
      --sans:  'DM Sans', system-ui, sans-serif;
      --mono:  'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Franja rasta ────────────────────────────────────── */
    .stripe {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      display: flex;
      z-index: 100;
    }
    .stripe span { flex: 1; }
    .stripe span:nth-child(1) { background: var(--green); }
    .stripe span:nth-child(2) { background: var(--gold); }
    .stripe span:nth-child(3) { background: var(--red); }

    /* ── Layout ──────────────────────────────────────────── */
    .page {
      padding-top: 2px;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .shell {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      padding: 0 32px;
    }

    /* ── Header ──────────────────────────────────────────── */
    .site-header {
      padding: 40px 0 0;
    }

    .header-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--text-faint);
    }

    /* ── Hero ────────────────────────────────────────────── */
    .hero {
      padding: 64px 0 72px;
    }

    .wordmark {
      display: block;
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(52px, 10vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
    }

    .wordmark__first {
      display: block;
      color: var(--text-mute);
      font-style: italic;
    }

    .wordmark__second {
      display: block;
      color: var(--text);
      font-style: normal;
      font-weight: 500;
    }

    .wordmark__accent {
      font-style: italic;
      color: var(--gold);
    }

    /* ── Pillars ─────────────────────────────────────────── */
    .pillars {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pillar {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .pillar__label {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      font-style: italic;
      color: var(--text-soft);
      flex-shrink: 0;
      width: 80px;
    }

    .pillar__detail {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .pillar__sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
      align-self: center;
    }

    /* ── Nav ─────────────────────────────────────────────── */
    .site-nav {
      border-top: 0.5px solid var(--border);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 0.5px solid var(--border);
      cursor: pointer;
      transition: gap 200ms ease-out;
    }

    .nav-item:hover { gap: 32px; }
    .nav-item:hover .nav-num { color: var(--text-mute); }
    .nav-item:hover .nav-title { color: var(--green); }
    .nav-item:hover .nav-arrow { opacity: 1; transform: translateX(4px); }

    .nav-num {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      transition: color 200ms;
      flex-shrink: 0;
      width: 32px;
    }

    .nav-body { flex: 1; }

    .nav-title {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.1;
      transition: color 200ms;
    }

    .nav-desc {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 300;
      color: var(--text-dim);
      margin-top: 4px;
      line-height: 1.5;
    }

    .nav-arrow {
      font-size: 18px;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 200ms, transform 200ms ease-out;
      flex-shrink: 0;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .site-footer {
      padding: 32px 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 0.5px solid var(--border);
    }

    .footer-sig {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-faint);
    }

    .footer-ig {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      transition: color 150ms;
    }

    .footer-ig:hover { color: var(--green); }

    /* ── Entrada ─────────────────────────────────────────── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .wordmark   { animation: rise 0.6s ease-out both; }
    .pillars    { animation: rise 0.6s ease-out 0.1s both; }
    .nav-item:nth-child(1) { animation: rise 0.5s ease-out 0.2s both; }
    .nav-item:nth-child(2) { animation: rise 0.5s ease-out 0.28s both; }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 480px) {
      .shell { padding: 0 24px; }
      .hero  { padding: 48px 0 56px; }
      .pillar { flex-direction: column; gap: 4px; }
      .pillar__sep { display: none; }
      .pillar__label { width: auto; }
    }
  </style>
</head>
<body>

<div class="stripe" aria-hidden="true">
  <span></span><span></span><span></span>
</div>

<div class="page">

  <header class="site-header">
    <div class="shell">
      <span class="header-label">Cuaderno personal · CDMX · 2026</span>
    </div>
  </header>

  <main>
    <div class="shell">

      <!-- Hero -->
      <section class="hero">

        <span class="wordmark" aria-label="Jorge, y malgesto.">
          <span class="wordmark__first">jorge,</span>
          <span class="wordmark__second">y mal<span class="wordmark__accent">gesto</span>.</span>
        </span>

        <div class="pillars">
          <div class="pillar">
            <span class="pillar__label">Bajo</span>
            <div class="pillar__sep"></div>
            <span class="pillar__detail">Cumbia · Hip Hop · Rock Punk</span>
          </div>
          <div class="pillar">
            <span class="pillar__label">Datos</span>
            <div class="pillar__sep"></div>
            <span class="pillar__detail">dataDesk · Restaurantes</span>
          </div>
        </div>

      </section>

      <!-- Nav -->
      <nav class="site-nav" aria-label="Apartados">

        <a href="herramientas/" class="nav-item">
          <span class="nav-num">01</span>
          <div class="nav-body">
            <div class="nav-title">Herramientas</div>
            <div class="nav-desc">Afinador, EQ del Hartke, setlist navegador.</div>
          </div>
          <span class="nav-arrow">→</span>
        </a>

        <a href="conocimiento/" class="nav-item">
          <span class="nav-num">02</span>
          <div class="nav-body">
            <div class="nav-title">Conocimiento</div>
            <div class="nav-desc">Corrección de color, rastafari, armonía de bajo.</div>
          </div>
          <span class="nav-arrow">→</span>
        </a>

      </nav>

    </div>
  </main>

  <footer class="site-footer">
    <div class="shell" style="display:contents">
      <span class="footer-sig">Jorge Malgesto · 2026</span>
      <a href="https://instagram.com/jorgemalgesto" class="footer-ig" target="_blank" rel="noopener">@jorgemalgesto</a>
    </div>
  </footer>

</div>

</body>
</html>
